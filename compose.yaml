services:
  data-database:
    image: mongo:8.0-rc
    ports:
      - "27017:27017"
    networks:
      - backend


  content-database:
    image: quay.io/minio/minio:latest
    ports:
      - "9000:9000"
      - "9001:9001"
    networks:
      - backend
    command: ["server", "--console-address", ":9001", "/data"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://content-database:9000/minio/health/live"]
      interval: 5s
      timeout: 4s
      retries: 5
    volumes:
      - ./minio/data:/mnt/data
      - ./minio/minio.license:/minio.license
      - ./minio/certs:/etc/minio/certs
    environment:
      MINIO_ROOT_USER: api_username
      MINIO_ROOT_PASSWORD: api_password

  content-bucket-setup:
    image: quay.io/minio/mc:latest # mc = minio client
    networks:
      - backend
    depends_on:
      content-database:
        condition: service_healthy
        restart: true
    restart: on-failure
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set dockerminio http://content-database:9000 api_username api_password;
      /usr/bin/mc mb dockerminio/profile-picture-bucket;
      /usr/bin/mc mb dockerminio/image-bucket;
      /usr/bin/mc mb dockerminio/video-bucket;
      exit 0;
      "

networks:
  frontend: {}
  backend: {}